<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>マブガル速度比較</title>

    <!-- 外部CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>マブガル速度比較</h1>

    <!-- 8人分の比較枠 -->

    <div class="character-grid" id="characterGrid"></div>

    <!-- キャラクター選択ポップアップ -->

    <div class="modal-overlay" id="modalOverlay">

        <div class="modal">

            <!-- ヘッダー -->

            <div class="modal-header">

                <span>キャラクターを選択</span>

                <button

                    class="close-button"

                    onclick="closeModal()"

                    type="button">

                    ×

                </button>

            </div>

            <!-- 属性選択 -->

            <div class="attribute-selector" id="attributeSelector">

                <button class="attribute-button" data-attribute="アグレッシブ" type="button">

                    アグレッシブ

                </button>

                <button class="attribute-button" data-attribute="スマート" type="button">

                    スマート

                </button>

                <button class="attribute-button" data-attribute="シャイ" type="button">

                    シャイ

                </button>

                <button class="attribute-button" data-attribute="キュート" type="button">

                    キュート

                </button>

                <button class="attribute-button" data-attribute="コミカル" type="button">

                    コミカル

                </button>

                <button class="attribute-button" data-attribute="クレバー" type="button">

                    クレバー

                </button>

            </div>

            <!-- キャラクター一覧 -->

            <div class="character-list" id="characterList"></div>

        </div>

    </div>

    <!-- JavaScript -->

    <script>
  

/* =========================
   キャラクターデータ読み込み
========================= */

fetch("characters.JSON")
    .then(response => {
        if (!response.ok) {
            throw new Error("characters.JSONを読み込めませんでした");
        }
        return response.json();
    })
    .then(characters => {

        /* =========================
           ギアデータ
        ========================= */

       const gears = [
    { name: "Ⅲ-S", value: 7.19 },
    { name: "Ⅲ-A", value: 6.00 },
    { name: "Ⅱ-S", value: 5.40 },
    { name: "Ⅲ-B", value: 4.50 },
    { name: "Ⅱ-A", value: 4.49 },
    { name: "Ⅰ-S", value: 3.60 },
    { name: "Ⅲ-C", value: 3.50 },
    { name: "Ⅱ-B", value: 3.37 },
    { name: "Ⅰ-A", value: 3.00 },
    { name: "Ⅲ-D", value: 2.00 },
    { name: "Ⅰ-B", value: 2.25 },
    { name: "Ⅱ-C", value: 2.62 },
    { name: "Ⅱ-D", value: 1.50 },
    { name: "Ⅰ-C", value: 1.50 },
    { name: "Ⅰ-D", value: 1.00 }
];

        const ITEMS_PER_PAGE = 9;
        let activeCard = null;
        let currentPage = 1;
        let currentAttribute = "アグレッシブ";
        let savedScrollTop = 0;

        const grid = document.getElementById("characterGrid");
        const characterList = document.getElementById("characterList");
        const attributeButtons = document.querySelectorAll(".attribute-button");

        /* =========================
           ページ切り替えUIを追加
        ========================= */

        const pagination = document.createElement("div");
        pagination.id = "pagination";
        pagination.style.display = "flex";
        pagination.style.justifyContent = "center";
        pagination.style.alignItems = "center";
        pagination.style.gap = "12px";
        pagination.style.marginTop = "16px";

        characterList.insertAdjacentElement("afterend", pagination);

        /* =========================
           8人分の比較枠を作成
        ========================= */

        for (let i = 1; i <= 8; i++) {

            const card = document.createElement("div");
            card.className = "character-card";

            card.innerHTML = `
                <div class="card-layout">
                    <div class="left-side">

                        <button
                            class="character-image"
                            id="image${i}"
                            onclick="openModal(${i})"
                            type="button">
                            <span>＋</span>
                        </button>

                        <div class="level-area">
                            <label for="level${i}">レベル</label>
                            <input
                                type="number"
                                id="level${i}"
                                value="200"
                                min="1">
                        </div>

                        <div class="result-box">
                            <div class="result-title">最終速度</div>
                            <div class="result-value" id="result${i}">--</div>
                        </div>

                    </div>

                    <div class="gear-area">
                        <div class="gear-title">ギア設定</div>

                        <div class="gear-row">
                            <label for="gear${i}-1">ギア1</label>
                            <select id="gear${i}-1">
                                <option value="0">なし</option>
                            </select>
                        </div>

                        <div class="gear-row">
                            <label for="gear${i}-2">ギア2</label>
                            <select id="gear${i}-2">
                                <option value="0">なし</option>
                            </select>
                        </div>

                        <div class="gear-row">
                            <label for="gear${i}-3">ギア3</label>
                            <select id="gear${i}-3">
                                <option value="0">なし</option>
                            </select>
                        </div>
                    </div>
                </div>
            `;

            grid.appendChild(card);

            for (let slot = 1; slot <= 3; slot++) {

                const select = document.getElementById(`gear${i}-${slot}`);

                gears.forEach(gear => {
                    const option = document.createElement("option");
                    option.value = gear.value;
                    option.textContent = `${gear.name} (${gear.value}%)`;
                    select.appendChild(option);
                });

                select.addEventListener("change", () => {
                    calculateSpeed(i);
                });
            }

            document.getElementById(`level${i}`).addEventListener("input", () => {
                calculateSpeed(i);
            });
        }

        /* =========================
           速度計算
        ========================= */

        function calculateSpeed(cardNumber) {

            const imageButton = document.getElementById("image" + cardNumber);
            const result = document.getElementById("result" + cardNumber);

            if (imageButton.dataset.characterIndex === undefined) {
                result.textContent = "--";
                return;
            }

            const character = characters[
                Number(imageButton.dataset.characterIndex)
            ];

            const level = Number(
                document.getElementById("level" + cardNumber).value
            );

            if (!Number.isFinite(level) || level < 1) {
                result.textContent = "--";
                return;
            }

            let gearTotal = 0;

            for (let slot = 1; slot <= 3; slot++) {
                const select = document.getElementById(`gear${cardNumber}-${slot}`);
                gearTotal += Number(select.value);
            }

            const baseSpeed =
                character.speed +
                (level - 200) * character.clan;

            const speed = baseSpeed * (1 + gearTotal / 100);

            result.textContent = Math.floor(speed);
        }

        /* =========================
           属性ボタン
        ========================= */

        attributeButtons.forEach(button => {

            button.onclick = () => {

                currentAttribute = button.dataset.attribute;
                currentPage = 1;

                attributeButtons.forEach(btn => {
                    btn.classList.remove("active");
                });

                button.classList.add("active");

                showCharacters();
            };
        });

        /* =========================
           キャラクター一覧・ページ表示
        ========================= */

        function showCharacters() {

            characterList.innerHTML = "";
            pagination.innerHTML = "";

            const filteredCharacters = characters.filter(character => {
                return character.attribute === currentAttribute;
            });

            if (filteredCharacters.length === 0) {
                characterList.innerHTML = `
                    <div class="empty-character-list">
                        該当キャラクターがいません
                    </div>
                `;
                return;
            }

            const totalPages = Math.ceil(
                filteredCharacters.length / ITEMS_PER_PAGE
            );

            /* ページ範囲を調整 */

            currentPage = Math.min(
                Math.max(currentPage, 1),
                totalPages
            );

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;

            const pageCharacters = filteredCharacters.slice(
                startIndex,
                endIndex
            );

            /* 現在のページのキャラクターだけ表示 */

            pageCharacters.forEach(character => {

                const option = document.createElement("div");
                option.className = "character-option";

                const image = document.createElement("img");
                image.src = character.image;
                image.alt = character.name;

                const name = document.createElement("p");
                name.textContent = character.name;

                const placeholder = document.createElement("div");
                placeholder.className = "character-placeholder";
                placeholder.appendChild(image);

                option.appendChild(placeholder);
                option.appendChild(name);

                option.onclick = () => {
                    selectCharacter(character);
                };

                characterList.appendChild(option);
            });

            /* =========================
               ページ切り替えボタン
            ========================= */

            if (totalPages > 1) {

                const prevButton = document.createElement("button");
                prevButton.type = "button";
                prevButton.textContent = "前へ";
                prevButton.disabled = currentPage === 1;

                prevButton.onclick = () => {
                    currentPage--;
                    showCharacters();
                };

                const pageText = document.createElement("span");
                pageText.textContent = `${currentPage} / ${totalPages} ページ`;

                const nextButton = document.createElement("button");
                nextButton.type = "button";
                nextButton.textContent = "次へ";
                nextButton.disabled = currentPage === totalPages;

                nextButton.onclick = () => {
                    currentPage++;
                    showCharacters();
                };

                pagination.appendChild(prevButton);
                pagination.appendChild(pageText);
                pagination.appendChild(nextButton);
            }
        }

       /* =========================
   ポップアップを開く
========================= */

function openModal(cardNumber) {

    activeCard = cardNumber;

    document.getElementById("modalOverlay").classList.add("active");

    attributeButtons.forEach(button => {

        button.classList.remove("active");

        if (button.dataset.attribute === currentAttribute) {
            button.classList.add("active");
        }
    });

    showCharacters();

    characterList.scrollTop = savedScrollTop;
}

window.openModal = openModal;

        /* =========================
             ポップアップを閉じる
        ========================= */

function closeModal() {

    savedScrollTop = characterList.scrollTop;

    document.getElementById("modalOverlay").classList.remove("active");
}

window.closeModal = closeModal;

        /* =========================
           キャラクター選択
        ========================= */

        function selectCharacter(character) {

            if (!activeCard) return;

            const imageButton = document.getElementById("image" + activeCard);

            const image = document.createElement("img");
            image.src = character.image;
            image.alt = character.name;

            imageButton.innerHTML = "";
            imageButton.appendChild(image);

            imageButton.dataset.characterName = character.name;
            imageButton.dataset.characterIndex = characters.indexOf(character);

            calculateSpeed(activeCard);
            closeModal();
        }

        /* =========================
           ポップアップ外クリック
        ========================= */

        document.getElementById("modalOverlay").addEventListener("click", function(event) {

            if (event.target === this) {
                closeModal();
            }
        });

        console.log("キャラクターデータ読み込み成功:", characters.length + "人");
    })
    .catch(error => {

        console.error("読み込みエラー:", error);

        document.getElementById("characterGrid").innerHTML = `
            <p>キャラクターデータの読み込みに失敗しました。JSONファイル名や内容を確認してください。</p>
        `;
    });


    </script>

</body>

</html>
