<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マブガル速度比較</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 14px;
    background: #f1f5fb;
    color: #243247;
    font-family: sans-serif;
}

h1 {
    text-align: center;
    background: #263b56;
    color: white;
    border-radius: 12px;
    padding: 18px 8px;
    margin: 0 0 18px;
    font-size: 24px;
}

/* 8人の比較枠 */
.character-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

/* キャラクター枠 */
.character-card {
    background: white;
    border: 1px solid #d5deea;
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    min-width: 0;
}

/* 枠の内部 */
.card-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
}

/* 左側 */
.left-side {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
}

/* キャラクター画像 */
.character-image {
    width: 100%;
    aspect-ratio: 3 / 4;
    border: 2px solid #cbd9ed;
    border-radius: 12px;
    background: linear-gradient(145deg, #e5edfa, #f7faff);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    cursor: pointer;
    color: #66809e;
    font-size: 38px;
}

.character-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.character-image:hover {
    border-color: #3b82f6;
}

/* レベル */
.level-area {
    width: 100%;
}

label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 10px 8px;
    border: 1px solid #ccd6e4;
    border-radius: 9px;
    background: white;
    font-size: 16px;
    color: #263447;
}

/* 速度 */
.result-box {
    background: #e2edff;
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
}

.result-title {
    font-weight: bold;
    color: #2878df;
    font-size: 14px;
}

.result-value {
    font-size: 26px;
    font-weight: bold;
    color: #2878df;
    overflow-wrap: anywhere;
}

/* 右側のギア */
.gear-area {
    border-left: 2px solid #d6deea;
    padding-left: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
}

.gear-title {
    font-weight: bold;
    font-size: 15px;
}

.gear-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.gear-row label {
    margin-bottom: 0;
    font-size: 13px;
}

/* ポップアップ */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 34, 53, 0.65);
    z-index: 1000;
    padding: 16px;
    justify-content: center;
    align-items: center;
}

.modal-overlay.active {
    display: flex;
}

.modal {
    background: white;
    width: 100%;
    max-width: 600px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 18px;
    padding: 16px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 18px;
    font-weight: bold;
}

.close-button {
    border: none;
    background: #e8eef7;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 16px;
    cursor: pointer;
}

.character-list {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
}

.character-option {
    border: 2px solid #d5dfed;
    background: #f3f7fc;
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
    text-align: center;
}

.character-option:hover {
    border-color: #3b82f6;
    background: #eaf3ff;
}

.character-placeholder {
    aspect-ratio: 3 / 4;
    background: linear-gradient(145deg, #dce7f6, #f3f7fc);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: #69819d;
}

.character-option p {
    font-size: 12px;
    margin: 8px 0 0;
    overflow-wrap: anywhere;
}

.notice {
    text-align: center;
    font-size: 13px;
    color: #64748b;
    margin-top: 14px;
}

/* スマホ向け */
@media (max-width: 480px) {
    body {
        padding: 8px;
    }

    h1 {
        font-size: 19px;
        padding: 14px 6px;
    }

    .character-grid {
        gap: 8px;
    }

    .character-card {
        padding: 6px;
    }

    .card-layout {
        gap: 6px;
    }

    .gear-area {
        padding-left: 6px;
        gap: 8px;
    }

    input,
    select {
        padding: 8px 4px;
        font-size: 14px;
    }

    .result-value {
        font-size: 21px;
    }

    .gear-title {
        font-size: 13px;
    }

    label {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<h1>マブガル速度比較</h1>

<div class="character-grid" id="characterGrid"></div>

<!-- キャラクター選択ポップアップ -->

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        
        <!-- ヘッダー -->
        <div class="modal-header">
            <span>キャラクターを選択</span>
            <button
                class="close-button"
                onclick="closeModal()"
                type="button">
                ×
            </button>
        </div>

        <!-- 属性選択 -->
        <div class="attribute-selector" id="attributeSelector">
            <button class="attribute-button" data-attribute="アグレッシブ">

                アグレッシブ

            </button>

            <button class="attribute-button" data-attribute="スマート">

                スマート

            </button>

            <button class="attribute-button" data-attribute="シャイ">

                シャイ

            </button>

            <button class="attribute-button" data-attribute="キュート">

                キュート

            </button>

            <button class="attribute-button" data-attribute="コミカル">

                コミカル

            </button>

            <button class="attribute-button" data-attribute="クレバー">

                クレバー

            </button>

        </div>

        <!-- キャラクター一覧 -->

        <div class="character-list" id="characterList">

        </div>

    </div>

</div>

<script>

/* 現在は仮のキャラクター一覧 */
const characters = [
    { name: "桃園める", speed: 761, clan: 2 },
    { name: "鳴滝七彩", speed: 751, clan: 2 },
    { name: "朽葉ラミ", speed: 750, clan: 2 },
    { name: "一条白奈", speed: 713, clan: 2 },
    { name: "月ヶ瀬ちゆる", speed: 726, clan: 2 }
];

let activeCard = null;

/* 8人分の枠を作成 */
const grid = document.getElementById("characterGrid");

for (let i = 1; i <= 8; i++) {

    const card = document.createElement("div");
    card.className = "character-card";

    card.innerHTML = `
        <div class="card-layout">

            <!-- 左側 -->
            <div class="left-side">

                <button
                    class="character-image"
                    id="image${i}"
                    onclick="openModal(${i})"
                    type="button">
                    <span>＋</span>
                </button>

                <div class="level-area">
                    <label for="level${i}">レベル</label>
                    <input
                        type="number"
                        id="level${i}"
                        value="200"
                        min="1">
                </div>

                <div class="result-box">
                    <div class="result-title">最終速度</div>
                    <div class="result-value" id="result${i}">--</div>
                </div>

            </div>

            <!-- 右側 -->
            <div class="gear-area">

                <div class="gear-title">ギア設定</div>

                <div class="gear-row">
                    <label for="gear${i}-1">ギア1</label>
                    <select id="gear${i}-1">
                        <option value="">なし</option>
                    </select>
                </div>

                <div class="gear-row">
                    <label for="gear${i}-2">ギア2</label>
                    <select id="gear${i}-2">
                        <option value="">なし</option>
                    </select>
                </div>

                <div class="gear-row">
                    <label for="gear${i}-3">ギア3</label>
                    <select id="gear${i}-3">
                        <option value="">なし</option>
                    </select>
                </div>

            </div>

        </div>
    `;

    grid.appendChild(card);
}

/* ポップアップにキャラクター一覧を作成 */
const characterList = document.getElementById("characterList");

characters.forEach((name, index) => {

    const option = document.createElement("div");
    option.className = "character-option";

    option.innerHTML = `
        <div class="character-placeholder">👤</div>
        <p>${name}</p>
    `;

    option.onclick = () => selectCharacter(index);

    characterList.appendChild(option);
});

/* ポップアップを開く */
function openModal(cardNumber) {
    activeCard = cardNumber;
    document.getElementById("modalOverlay").classList.add("active");
}

/* ポップアップを閉じる */
function closeModal() {
    document.getElementById("modalOverlay").classList.remove("active");
}

/* キャラクターを選択 */
function selectCharacter(index) {

    if (!activeCard) return;

    const imageButton = document.getElementById("image" + activeCard);

    imageButton.innerHTML = `
        <div style="
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            height:100%;
            width:100%;
            gap:8px;
            padding:8px;
        ">
            <span style="font-size:32px;">👤</span>
            <span style="font-size:12px;text-align:center;">
                ${characters[index]}
            </span>
        </div>
    `;

    /* 選択後に速度表示を初期状態にする */
    document.getElementById("result" + activeCard).textContent = "--";

    closeModal();
}

/* ポップアップ外を押した場合も閉じる */
document.getElementById("modalOverlay").addEventListener("click", function(event) {
    if (event.target === this) {
        closeModal();
    }
});

</script>

</body>
</html>
