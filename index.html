<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>マブガル速度比較</title>

    <!-- 外部CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>マブガル速度比較</h1>

    <!-- 8人分の比較枠 -->

    <div class="character-grid" id="characterGrid"></div>

    <!-- キャラクター選択ポップアップ -->

    <div class="modal-overlay" id="modalOverlay">

        <div class="modal">

            <!-- ヘッダー -->

            <div class="modal-header">

                <span>キャラクターを選択</span>

                <button

                    class="close-button"

                    onclick="closeModal()"

                    type="button">

                    ×

                </button>

            </div>

            <!-- 属性選択 -->

            <div class="attribute-selector" id="attributeSelector">

                <button class="attribute-button" data-attribute="アグレッシブ" type="button">

                    アグレッシブ

                </button>

                <button class="attribute-button" data-attribute="スマート" type="button">

                    スマート

                </button>

                <button class="attribute-button" data-attribute="シャイ" type="button">

                    シャイ

                </button>

                <button class="attribute-button" data-attribute="キュート" type="button">

                    キュート

                </button>

                <button class="attribute-button" data-attribute="コミカル" type="button">

                    コミカル

                </button>

                <button class="attribute-button" data-attribute="クレバー" type="button">

                    クレバー

                </button>

            </div>

            <!-- キャラクター一覧 -->

            <div class="character-list" id="characterList"></div>

        </div>

    </div>

    <!-- JavaScript -->

    <script>
  

    /* キャラクターデータ */

    const characters = [

        {
            name: "桃園める",
            speed: 761,
            clan: 2,
            attribute: "アグレッシブ",
            image: "image/meru.png"
        },

        {
            name: "鳴滝七彩",
            speed: 751,
            clan: 2,
            attribute: "キュート",
            image: "image/nanairo.png"
        },

        {
            name: "朽葉ラミ",
            speed: 750,
            clan: 2,
            attribute: "シャイ",
            image: "image/rami.png"
        },

        {
            name: "一条白奈",
            speed: 713,
            clan: 2,
            attribute: "スマート",
            image: "image/shirona.png"
        },

        {
            name: "月ヶ瀬ちゆる",
            speed: 726,
            clan: 2,
            attribute: "シャイ",
            image: "image/chiyuru.png"

        }

    ];
    
    /* =========================

   ギアデータ

========================= */

const gears = [

    { name: "ティア1・ランクD", value: 1.00 },
    { name: "ティア1・ランクC", value: 1.50 },
    { name: "ティア1・ランクB", value: 2.25 },
    { name: "ティア1・ランクA", value: 3.00 },
    { name: "ティア1・ランクS", value: 3.60 },
    { name: "ティア2・ランクD", value: 1.50 },
    { name: "ティア2・ランクC", value: 2.62 },
    { name: "ティア2・ランクB", value: 3.37 },
    { name: "ティア2・ランクA", value: 4.49 },
    { name: "ティア2・ランクS", value: 5.40 },
    { name: "ティア3・ランクD", value: 2.00 },
    { name: "ティア3・ランクC", value: 3.50 },
    { name: "ティア3・ランクB", value: 4.50 },
    { name: "ティア3・ランクA", value: 6.00 },
    { name: "ティア3・ランクS", value: 7.19 },
    { name: "無し", value: 0 }
];

    /* 現在操作中の枠 */

    let activeCard = null;

    /* 8人分の枠を作成 */

    const grid = document.getElementById("characterGrid");

    for (let i = 1; i <= 8; i++) {

        const card = document.createElement("div");

        card.className = "character-card";

        card.innerHTML = `

            <div class="card-layout">

                <div class="left-side">

                    <button

                        class="character-image"

                        id="image${i}"

                        onclick="openModal(${i})"

                        type="button">

                        <span>＋</span>

                    </button>

                    <div class="level-area">

                        <label for="level${i}">レベル</label>

                        <input

                            type="number"

                            id="level${i}"

                            value="200"

                            min="1">

                    </div>

                    <div class="result-box">

                        <div class="result-title">最終速度</div>

                        <div class="result-value" id="result${i}">--</div>

                    </div>

                </div>

                <div class="gear-area">

                    <div class="gear-title">ギア設定</div>

                    <div class="gear-row">

                        <label for="gear${i}-1">ギア1</label>

                        <select id="gear${i}-1">

                            <option value="">なし</option>

                        </select>

                    </div>

                    <div class="gear-row">

                        <label for="gear${i}-2">ギア2</label>

                        <select id="gear${i}-2">

                            <option value="">なし</option>

                        </select>

                    </div>

                    <div class="gear-row">

                        <label for="gear${i}-3">ギア3</label>

                        <select id="gear${i}-3">

                            <option value="">なし</option>

                        </select>

                    </div>

                </div>

            </div>

        `;

        grid.appendChild(card);

    }

    /* キャラクター一覧の要素 */

    const characterList = document.getElementById("characterList");

    /* 属性ボタン */

    const attributeButtons = document.querySelectorAll(".attribute-button");

    /* 属性選択ボタンの動作 */

    attributeButtons.forEach(button => {

        button.onclick = () => {

            const attribute = button.dataset.attribute;

            attributeButtons.forEach(btn => {

                btn.classList.remove("active");

            });

            button.classList.add("active");

            showCharacters(attribute);

        };

    });

    /* 属性に対応するキャラクターを表示 */

    function showCharacters(attribute) {

        characterList.innerHTML = "";

        const filteredCharacters = characters.filter(character => {

            return character.attribute === attribute;

        });

        /* 該当キャラクターがいない場合 */

        if (filteredCharacters.length === 0) {

            characterList.innerHTML = `

                <div class="empty-character-list">

                    該当キャラクターがいません

                </div>

            `;

            return;

        }

        /* キャラクター画像を生成 */

        filteredCharacters.forEach(character => {

            const option = document.createElement("div");

            option.className = "character-option";

            option.innerHTML = `

                <div class="character-placeholder">

                    <img src="${character.image}" alt="${character.name}">

                </div>

                <p>${character.name}</p>

            `;

            option.onclick = () => {

                selectCharacter(character);

            };

            characterList.appendChild(option);

        });

    }

    /* ポップアップを開く */

    function openModal(cardNumber) {

        activeCard = cardNumber;

        document.getElementById("modalOverlay").classList.add("active");

        /* 初期属性をアグレッシブにする */

        attributeButtons.forEach(button => {

            button.classList.remove("active");

            if (button.dataset.attribute === "アグレッシブ") {

                button.classList.add("active");

            }

        });

        showCharacters("アグレッシブ");

    }

    /* ポップアップを閉じる */

    function closeModal() {

        document.getElementById("modalOverlay").classList.remove("active");

    }

    /* キャラクターを選択 */

    function selectCharacter(character) {

        if (!activeCard) return;

        const imageButton = document.getElementById("image" + activeCard);

        imageButton.innerHTML = `

            <img src="${character.image}" alt="${character.name}">

        `;

        imageButton.dataset.characterName = character.name;

        imageButton.dataset.characterIndex = characters.indexOf(character);

        /* 速度計算はまだ実装しない */

        document.getElementById("result" + activeCard).textContent = "--";

        closeModal();

    }

    /* ポップアップ外を押して閉じる */

    document.getElementById("modalOverlay").addEventListener("click", function(event) {

        if (event.target === this) {

            closeModal();

        }

    });

    </script>

</body>

</html>
